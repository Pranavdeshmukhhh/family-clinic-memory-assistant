<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Clinic System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #111; margin-bottom: 8px; text-align: center; }
    p { font-size: 14px; color: #666; text-align: center; margin-bottom: 24px; }
    .buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    a.btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      min-width: 200px;
      justify-content: center;
      transition: opacity 0.15s;
    }
    a.btn:hover { opacity: 0.85; }
    .btn-doc { background: #2563eb; color: #fff; }
    .btn-rx  { background: #16a34a; color: #fff; }
    .note { font-size: 12px; color: #999; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>🏥 Family Clinic System</h1>
  <p>Select your workstation to continue.</p>
  <div class="buttons">
    <a href="/doctor" class="btn btn-doc">🩺 Doctor's Desk</a>
    <a href="/pharmacy" class="btn btn-rx">💊 Pharmacy Counter</a>
  </div>
  <span class="note">Both apps share the same patient records and prescription queue.</span>
  <footer style="position:fixed;bottom:0;left:0;right:0;background:#fee2e2;color:#991b1b;text-align:center;padding:8px 16px;font-size:12px;font-weight:600;border-top:1px solid #fca5a5;">
    ⚠️ Decision support only. A licensed doctor must review every prescription before it reaches a patient.
  </footer>
</body>
</html>
