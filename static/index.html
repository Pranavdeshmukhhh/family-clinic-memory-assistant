<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Clinic Memory Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242836;
      --border: #2e3346;
      --text: #e4e6f0;
      --text-dim: #8b8fa3;
      --accent: #6c5ce7;
      --accent-glow: rgba(108, 92, 231, 0.25);
      --green: #00cec9;
      --green-dim: rgba(0, 206, 201, 0.15);
      --red: #ff6b6b;
      --red-dim: rgba(255, 107, 107, 0.12);
      --orange: #fdcb6e;
      --orange-dim: rgba(253, 203, 110, 0.12);
      --radius: 12px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ─── */
    header {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header .subtitle { font-size: 13px; color: var(--text-dim); }

    /* ── Tabs ─── */
    .tabs {
      display: flex;
      gap: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 14px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-dim);
      transition: all 0.2s;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: var(--accent-glow);
    }
    .tab-btn:hover:not(.active) { background: var(--surface2); }

    .tab-content { display: none; padding: 24px; max-width: 960px; margin: 0 auto; }
    .tab-content.active { display: block; }

    /* ── Cards ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Form ─── */
    label { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; display: block; }
    input, textarea, select {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover { filter: brightness(1.15); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-green { background: var(--green); color: var(--bg); }
    .btn-green:hover { filter: brightness(1.15); }

    /* ── Toggle ─── */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }
    .toggle input { display: none; }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 24px;
      transition: 0.3s;
    }
    .toggle .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }
    .toggle input:checked + .slider { background: var(--green); }
    .toggle input:checked + .slider::before { transform: translateX(20px); }

    /* ── Warning banner ─── */
    .warning-banner {
      background: var(--red-dim);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--red);
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .warning-banner.visible { display: flex; gap: 8px; align-items: flex-start; }

    /* ── Result ─── */
    .result-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      display: none;
    }
    .result-box.visible { display: block; }
    .result-box .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 6px;
    }
    .tag-green { background: var(--green-dim); color: var(--green); }
    .tag-orange { background: var(--orange-dim); color: var(--orange); }
    .tag-purple { background: var(--accent-glow); color: var(--accent); }

    /* ── Pending list ─── */
    .rx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      transition: border 0.2s;
    }
    .rx-item:hover { border-color: var(--accent); }
    .rx-info { flex: 1; }
    .rx-info .rx-id { font-size: 12px; color: var(--text-dim); }
    .rx-info .rx-med { font-size: 14px; font-weight: 600; margin: 2px 0; }
    .rx-info .rx-patient { font-size: 12px; color: var(--green); }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-dim);
      font-size: 14px;
    }

    /* ── Side-by-side ─── */
    .comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .comparison .result-box { margin-top: 0; }
    @media (max-width: 700px) { .comparison { grid-template-columns: 1fr; } }

    /* ── Risk profile ─── */
    .risk-card {
      background: linear-gradient(135deg, rgba(108,92,231,0.08), rgba(0,206,201,0.08));
      border: 1px solid var(--accent);
    }

    /* ── Spinner ─── */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--text-dim);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { color: var(--text-dim); font-size: 13px; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🏥 Family Clinic Memory Assistant</h1>
    <div class="subtitle">Doctor + Pharmacy &mdash; powered by Hindsight Memory</div>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('doctor')">🩺 Doctor View</button>
  <button class="tab-btn" onclick="switchTab('pharmacy')">💊 Pharmacy View</button>
</div>

<!-- ═══ DOCTOR TAB ═══ -->
<div id="tab-doctor" class="tab-content active">

  <div class="card">
    <h2>🩺 New Visit</h2>

    <label for="patient_id">Patient ID</label>
    <input type="text" id="patient_id" placeholder="e.g. patient_001" value="patient_001">

    <label for="symptoms">Symptoms</label>
    <textarea id="symptoms" placeholder="Describe the patient's symptoms..."></textarea>

    <label for="notes">Doctor's Notes (optional)</label>
    <textarea id="notes" placeholder="Additional observations..."></textarea>

    <div class="toggle-row">
      <label class="toggle">
        <input type="checkbox" id="use_memory" checked>
        <span class="slider"></span>
      </label>
      <span style="font-size:13px;">Use patient memory (Hindsight)</span>
    </div>

    <button class="btn btn-primary" id="btn-visit" onclick="submitVisit()">Submit Visit</button>
    <button class="btn btn-primary" id="btn-compare" onclick="submitComparison()" style="margin-left:8px; background: var(--surface2); border: 1px solid var(--accent); color: var(--accent);">
      Compare With vs Without Memory
    </button>
  </div>

  <!-- Warning banner (MODULE 1) -->
  <div id="warning-banner" class="warning-banner">
    <span style="font-size:18px;">⚠️</span>
    <div>
      <strong>Drug Interaction / Allergy Warning</strong>
      <div id="warning-text"></div>
    </div>
  </div>

  <!-- Single result -->
  <div id="visit-result" class="result-box"></div>

  <!-- Side-by-side comparison (MODULE 2) -->
  <div id="comparison-container" class="comparison" style="display:none;">
    <div>
      <div style="font-size:13px; font-weight:600; margin-bottom:6px; color:var(--green);">🧠 With Memory</div>
      <div id="result-with-memory" class="result-box visible"></div>
    </div>
    <div>
      <div style="font-size:13px; font-weight:600; margin-bottom:6px; color:var(--orange);">🚫 Without Memory</div>
      <div id="result-without-memory" class="result-box visible"></div>
    </div>
  </div>

  <!-- Risk Profile (MODULE 3) -->
  <div class="card risk-card" style="margin-top:16px;">
    <h2>📊 Patient Risk Profile</h2>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <input type="text" id="risk-patient-id" placeholder="patient_001" value="patient_001" style="max-width:200px; margin-bottom:0;">
      <button class="btn btn-green" onclick="loadRiskProfile()">Load</button>
    </div>
    <div id="risk-result" class="result-box"></div>
  </div>
</div>

<!-- ═══ PHARMACY TAB ═══ -->
<div id="tab-pharmacy" class="tab-content">

  <div class="card">
    <h2>💊 Pending Prescriptions</h2>
    <button class="btn btn-primary" onclick="loadPending()" style="margin-bottom:14px;">🔄 Refresh Queue</button>
    <div id="pending-list"></div>
  </div>

  <div class="card">
    <h2>📋 Dispense Result</h2>
    <div id="dispense-result" class="result-box"></div>
  </div>

  <div class="card">
    <h2>📦 Inventory</h2>
    <button class="btn btn-green" onclick="loadInventory()" style="margin-bottom:14px;">Load Inventory</button>
    <div id="inventory-list"></div>
  </div>
</div>

<script>
const API = '';

// ── Tab switching ──
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (tab === 'doctor' && i === 0) || (tab === 'pharmacy' && i === 1));
  });
  document.getElementById('tab-doctor').classList.toggle('active', tab === 'doctor');
  document.getElementById('tab-pharmacy').classList.toggle('active', tab === 'pharmacy');
  if (tab === 'pharmacy') loadPending();
}

// ── Doctor: Submit Visit ──
async function submitVisit() {
  const btn = document.getElementById('btn-visit');
  const resultBox = document.getElementById('visit-result');
  const warningBanner = document.getElementById('warning-banner');
  const comparisonContainer = document.getElementById('comparison-container');

  comparisonContainer.style.display = 'none';
  warningBanner.classList.remove('visible');

  const payload = {
    patient_id: document.getElementById('patient_id').value.trim(),
    symptoms: document.getElementById('symptoms').value.trim(),
    notes: document.getElementById('notes').value.trim(),
    use_memory: document.getElementById('use_memory').checked,
  };

  if (!payload.patient_id || !payload.symptoms) {
    alert('Please enter Patient ID and Symptoms');
    return;
  }

  btn.disabled = true;
  resultBox.innerHTML = '<span class="spinner"></span><span class="loading-text">Consulting AI with patient history...</span>';
  resultBox.classList.add('visible');

  try {
    const res = await fetch(`${API}/doctor/visit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    // Show warning (MODULE 1)
    if (data.warning) {
      document.getElementById('warning-text').textContent = data.warning;
      warningBanner.classList.add('visible');
    }

    resultBox.innerHTML = formatVisitResult(data);
  } catch (err) {
    resultBox.innerHTML = `<span style="color:var(--red);">Error: ${err.message}</span>`;
  }
  btn.disabled = false;
}

// ── Doctor: Compare with/without memory (MODULE 2) ──
async function submitComparison() {
  const btn = document.getElementById('btn-compare');
  const resultBox = document.getElementById('visit-result');
  const comparisonContainer = document.getElementById('comparison-container');
  const warningBanner = document.getElementById('warning-banner');
  const resultWith = document.getElementById('result-with-memory');
  const resultWithout = document.getElementById('result-without-memory');

  resultBox.classList.remove('visible');
  warningBanner.classList.remove('visible');

  const payload = {
    patient_id: document.getElementById('patient_id').value.trim(),
    symptoms: document.getElementById('symptoms').value.trim(),
    notes: document.getElementById('notes').value.trim(),
  };

  if (!payload.patient_id || !payload.symptoms) {
    alert('Please enter Patient ID and Symptoms');
    return;
  }

  btn.disabled = true;
  comparisonContainer.style.display = 'grid';
  resultWith.innerHTML = '<span class="spinner"></span><span class="loading-text">With memory...</span>';
  resultWithout.innerHTML = '<span class="spinner"></span><span class="loading-text">Without memory...</span>';

  try {
    const [resWith, resWithout] = await Promise.all([
      fetch(`${API}/doctor/visit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, use_memory: true }),
      }).then(r => r.json()),
      fetch(`${API}/doctor/visit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, use_memory: false }),
      }).then(r => r.json()),
    ]);

    resultWith.innerHTML = formatVisitResult(resWith);
    resultWithout.innerHTML = formatVisitResult(resWithout);

    if (resWith.warning) {
      document.getElementById('warning-text').textContent = resWith.warning;
      warningBanner.classList.add('visible');
    }
  } catch (err) {
    resultWith.innerHTML = `<span style="color:var(--red);">Error: ${err.message}</span>`;
    resultWithout.innerHTML = '';
  }
  btn.disabled = false;
}

function formatVisitResult(data) {
  const memTag = data.use_memory
    ? '<span class="tag tag-green">🧠 Memory ON</span>'
    : '<span class="tag tag-orange">🚫 Memory OFF</span>';
  const newTag = data.is_new_patient
    ? '<span class="tag tag-orange">New Patient</span>' : '';

  return `
    ${memTag}${newTag}
    <span class="tag tag-purple">Rx: ${data.prescription.prescription_id}</span>

    <strong>Diagnosis:</strong> ${data.ai_diagnosis || 'N/A'}

    <strong>Prescription:</strong> ${data.prescription.medicine_name} — ${data.prescription.dosage}
    ${data.prescription.notes ? `<strong>Instructions:</strong> ${data.prescription.notes}` : ''}

    <strong>Reasoning:</strong> ${data.ai_reasoning || 'N/A'}

    <strong>Memory Used:</strong> ${data.memory_used || 'None'}

    ✅ Prescription sent to pharmacy queue (status: pending)
  `;
}

// ── Pharmacy: Load pending ──
async function loadPending() {
  const container = document.getElementById('pending-list');
  container.innerHTML = '<span class="spinner"></span><span class="loading-text">Loading...</span>';

  try {
    const res = await fetch(`${API}/pharmacy/pending`);
    const data = await res.json();

    if (!data.pending || data.pending.length === 0) {
      container.innerHTML = '<div class="empty-state">No pending prescriptions 🎉</div>';
      return;
    }

    container.innerHTML = data.pending.map(rx => `
      <div class="rx-item">
        <div class="rx-info">
          <div class="rx-id">${rx.prescription_id}</div>
          <div class="rx-med">💊 ${rx.medicine_name} — ${rx.dosage}</div>
          <div class="rx-patient">Patient: ${rx.patient_id}</div>
        </div>
        <button class="btn btn-green" onclick="dispense('${rx.prescription_id}')">Dispense</button>
      </div>
    `).join('');
  } catch (err) {
    container.innerHTML = `<span style="color:var(--red);">Error: ${err.message}</span>`;
  }
}

// ── Pharmacy: Dispense ──
async function dispense(rxId) {
  const resultBox = document.getElementById('dispense-result');
  resultBox.innerHTML = '<span class="spinner"></span><span class="loading-text">Dispensing...</span>';
  resultBox.classList.add('visible');

  try {
    const res = await fetch(`${API}/pharmacy/dispense`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prescription_id: rxId }),
    });
    const data = await res.json();

    let html = `
      <span class="tag tag-green">✅ Dispensed</span>
      <span class="tag tag-purple">${data.prescription_id}</span>

      <strong>Patient:</strong> ${data.patient_id}
      <strong>Dispensed:</strong> ${data.dispensed_medicine} — ${data.dosage}
    `;

    if (data.substitution) {
      html += `
      <strong style="color:var(--orange);">⚡ Substitution:</strong>
      Original "${data.original_medicine}" was out of stock.
      Alternative: ${data.substitution.alternative}
      Reason: ${data.substitution.reason}
      `;
    }

    if (data.stock_warning) {
      html += `\n<strong style="color:var(--red);">${data.stock_warning}</strong>`;
    }

    if (data.patient_context) {
      html += `\n<strong>Patient Context:</strong>\n${data.patient_context}`;
    }

    resultBox.innerHTML = html;
    loadPending(); // refresh queue
  } catch (err) {
    resultBox.innerHTML = `<span style="color:var(--red);">Error: ${err.message}</span>`;
  }
}

// ── Inventory ──
async function loadInventory() {
  const container = document.getElementById('inventory-list');
  container.innerHTML = '<span class="spinner"></span><span class="loading-text">Loading...</span>';

  try {
    const res = await fetch(`${API}/inventory`);
    const data = await res.json();

    container.innerHTML = `<table style="width:100%; font-size:13px; border-collapse:collapse;">
      <tr style="color:var(--text-dim); border-bottom:1px solid var(--border);">
        <th style="text-align:left; padding:8px;">Medicine</th>
        <th style="text-align:right; padding:8px;">Qty</th>
        <th style="text-align:right; padding:8px;">Threshold</th>
        <th style="text-align:center; padding:8px;">Status</th>
      </tr>
      ${data.inventory.map(m => {
        const low = m.quantity <= m.reorder_threshold;
        return `<tr style="border-bottom:1px solid var(--border);">
          <td style="padding:8px;">${m.medicine_name}</td>
          <td style="text-align:right; padding:8px; color:${low ? 'var(--red)' : 'var(--green)'}">${m.quantity}</td>
          <td style="text-align:right; padding:8px;">${m.reorder_threshold}</td>
          <td style="text-align:center; padding:8px;">${low ? '⚠️ Low' : '✅ OK'}</td>
        </tr>`;
      }).join('')}
    </table>`;
  } catch (err) {
    container.innerHTML = `<span style="color:var(--red);">Error: ${err.message}</span>`;
  }
}

// ── Risk Profile (MODULE 3) ──
async function loadRiskProfile() {
  const patientId = document.getElementById('risk-patient-id').value.trim();
  const resultBox = document.getElementById('risk-result');

  if (!patientId) { alert('Enter a patient ID'); return; }

  resultBox.innerHTML = '<span class="spinner"></span><span class="loading-text">Generating risk profile via Hindsight Reflect...</span>';
  resultBox.classList.add('visible');

  try {
    const res = await fetch(`${API}/patient/${patientId}/summary`);
    if (!res.ok) {
      const err = await res.json();
      resultBox.innerHTML = `<span style="color:var(--red);">Error: ${err.detail}</span>`;
      return;
    }
    const data = await res.json();
    resultBox.innerHTML = `<span class="tag tag-purple">🪞 Reflect Summary</span>\n\n${data.summary}`;
  } catch (err) {
    resultBox.innerHTML = `<span style="color:var(--red);">Error: ${err.message}</span>`;
  }
}

// Auto-load pending when pharmacy tab opens
document.addEventListener('DOMContentLoaded', () => {
  // nothing to auto-load on doctor tab initially
});
</script>
</body>
</html>
